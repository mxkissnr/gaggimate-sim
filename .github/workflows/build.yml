name: build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream GaggiMate tag to build (default: latest release)"
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/mxkissnr/gaggimate-sim

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve upstream ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          ref="${INPUT_REF:-$(gh release view --repo jniebuhr/gaggimate --json tagName --jq .tagName)}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building upstream ref: $ref"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (loaded locally)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:test
          build-args: GAGGIMATE_REF=${{ steps.ref.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name sim -p 8080:8080 "$IMAGE:test"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/; then
              echo "web UI reachable after ~$((i * 2)) s"
              exit 0
            fi
            sleep 2
          done
          docker logs sim
          exit 1

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:test
          format: sarif
          output: trivy.sarif
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload SARIF
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ref.outputs.ref }}
            ${{ env.IMAGE }}:latest
          build-args: GAGGIMATE_REF=${{ steps.ref.outputs.ref }}
          cache-from: type=gha

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release for new upstream tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.ref }}
          DIGEST: ${{ needs.build.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          {
            echo "Container image of the GaggiMate desktop simulator built from upstream \`$TAG\`."
            echo
            echo '```shell'
            echo "docker pull ghcr.io/mxkissnr/gaggimate-sim:$TAG"
            echo '```'
            echo
            echo "Image digest: \`$DIGEST\`"
            echo
            echo "Upstream release: https://github.com/jniebuhr/gaggimate/releases/tag/$TAG"
            echo
            echo "Licence: the image is CC BY-NC-SA 4.0, non-commercial use only."
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "GaggiMate simulator $TAG" --notes-file notes.md
