name: Feature Request
description: Suggest an improvement to the image or its build
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Have an idea? Describe it below. Features of the simulator itself belong in the upstream GaggiMate repository."

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve? What would it enable?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about? (optional)
